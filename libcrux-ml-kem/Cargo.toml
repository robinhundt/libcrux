authors.workspace = true
description = "Libcrux ML-KEM & Kyber implementations"
edition.workspace = true
exclude = [
    "*.pdf",
    "/extracts",
    "/hax.py",
    "/proofs",
    "/tests",
    "C-CODE.md",
    "TOOLS.md",
]
homepage.workspace = true
license.workspace = true
name = "test-foo-bar-ml-kem"
readme = "README.md"
repository.workspace = true
version = "0.0.9"

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
hax-lib.workspace = true
rand = { version = "0.10", optional = true, default-features = false }
test-foo-bar-intrinsics.workspace = true
test-foo-bar-platform.workspace = true
test-foo-bar-secrets.workspace = true
test-foo-bar-sha3.workspace = true
test-foo-bar-traits.workspace = true
tls_codec = { version = "0.4.2", features = [
    "derive",
], default-features = false, optional = true }

[features]
# By default all variants and std are enabled.
default = ["default-no-std", "std"]
default-no-std = ["mlkem1024", "mlkem512", "mlkem768", "rand"]

# Serialization & Deserialization using tls_codec
codec = ["dep:tls_codec"]

# Hardware features can be force enabled.
# It is not recommended to use these. This crate performs CPU feature detection
# and enables the features when they are available.
simd128 = ["test-foo-bar-intrinsics/simd128", "test-foo-bar-sha3/simd128"]
simd256 = ["test-foo-bar-intrinsics/simd256", "test-foo-bar-sha3/simd256"]

# Features for the different key sizes of ML-KEM
mlkem1024 = []
mlkem512 = []
mlkem768 = []

# Enable Round 3 Kyber in addition to ML-KEM
kyber = []

# APIs that sample their own randomness
rand = ["dep:rand"]

# std support
alloc = []
std = ["alloc", "rand/std", "tls_codec/std"]

# Incremental encapsulation API
incremental = []

# Checking secret independence
check-secret-independence = [
    "test-foo-bar-secrets/check-secret-independence",
    "test-foo-bar-traits/check-secret-independence",
]


# PQCP Common APIs
pqcp = []

[dev-dependencies]
criterion = "0.8"
hex = { version = "0.4.3", features = ["serde"] }
rand = { version = "0.10", features = ["thread_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
test-foo-bar-kats = { path = "../crates/testing/kats", features = ["mlkem"] }
test-foo-bar-traits = { workspace = true, features = ["generic-tests"] }

[[bench]]
harness = false
name = "ml-kem"

[[example]]
name = "encapsulate"
required-features = ["mlkem768"]

[[example]]
name = "decapsulate"
required-features = ["mlkem768"]

[[example]]
name = "keygen"
required-features = ["mlkem768"]

[package.metadata."docs.rs"]
features = ["codec", "kyber", "pqcp"]
rustdoc-args = ["--cfg", "doc_cfg"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(doc_cfg)',
    'cfg(eurydice)',
    'cfg(hax)',
] }
