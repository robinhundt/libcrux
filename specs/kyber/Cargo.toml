[package]
edition = "2021"
name = "hacspec_kyber"
version = "0.1.0"

[dependencies]
hacspec-lib = { version = "0.0.1", path = "../hacspec-lib" }
libcrux = { version = "=0.0.4", path = "../../" }

[dev-dependencies]
hex = { version = "0.4.3", features = ["serde"] }
pqcrypto-kyber = { version = "0.7.6", default-features = false }
proptest = "1.2.0"
rand = "0.10"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.102"
test-foo-bar-kem = { version = "=0.0.8", path = "../../test-foo-bar-kem", features = [
    "tests",
] }
