[package]
description = "Formally verified ECDSA signature library"
name = "test-foo-bar-ecdsa"
readme = "Readme.md"
version = "0.0.7"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rand = { version = "0.10", optional = true, default-features = false }
test-foo-bar-p256 = { workspace = true, default-features = true, features = [
    "expose-hacl",
] }
test-foo-bar-sha2.workspace = true

[features]
default = ["rand", "std"]
rand = ["dep:rand"]
std = ["rand?/std"]

[dev-dependencies]
rand = { version = "0.10", features = ["sys_rng"] }
rand_core = { version = "0.10" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
