[package]
authors.workspace = true
description = "Libcrux SHA-3 implementation"
edition.workspace = true
exclude = [
    "/c.sh",
    "/c.yaml",
    "/proofs",
    "/tests/tv",
    "hax.py",
    "tests/cavp.rs",
]
homepage.workspace = true
license.workspace = true
name = "test-foo-bar-sha3"
readme = "README.md"
repository.workspace = true
version = "0.0.10"

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
hax-lib.workspace = true
test-foo-bar-intrinsics.workspace = true
test-foo-bar-platform = { version = "0.0.4", path = "../../sys/platform" }
test-foo-bar-traits.workspace = true

[features]
simd128 = ["test-foo-bar-intrinsics/simd128"]
simd256 = ["test-foo-bar-intrinsics/simd256"]

[[bench]]
harness = false
name = "sha3"

[dev-dependencies]
clap = { version = "4.5.39", features = ["derive"] }
criterion = "0.8.0"
hex = "0.4.3"
pretty_env_logger = "0.5.0"
rand = "0.10"
test-foo-bar-cavp = { path = "../../../cavp" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(eurydice)', 'cfg(hax)'] }
