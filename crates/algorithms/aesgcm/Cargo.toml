[package]
authors.workspace = true
description = "Libcrux AES-GCM implementation"
edition.workspace = true
exclude = []
homepage.workspace = true
license.workspace = true
name = "test-foo-bar-aesgcm"
readme = "README.md"
repository.workspace = true
version = "0.0.9-pre.1"

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
test-foo-bar-intrinsics.workspace = true
test-foo-bar-platform.workspace = true
test-foo-bar-secrets.workspace = true
test-foo-bar-traits.workspace = true

[features]
default = []
std = []

# Hardware features can be force enabled.
# It is not recommended to use these. This crate performs CPU feature detection
# and enables the features when they are available.
simd128 = ["test-foo-bar-intrinsics/simd128"]
simd256 = ["test-foo-bar-intrinsics/simd256"]

[[bench]]
harness = false
name = "aesgcm"

[dev-dependencies]
aes-gcm = "0.10.3"
test-foo-bar-cavp = { path = "../../../cavp" }
criterion = "0.8.0"
hex = "0.4.3"
pretty_env_logger = "0.5.0"
rand = "0.10"
wycheproof = "0.6.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(eurydice)', 'cfg(hax)'] }
