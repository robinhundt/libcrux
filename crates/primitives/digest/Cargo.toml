[package]
description = "Digest library"
name = "test-foo-bar-digest"
readme = "Readme.md"
version = "0.0.8"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
test-foo-bar-blake2 = { workspace = true, optional = true }
test-foo-bar-sha2 = { workspace = true, optional = true }
test-foo-bar-sha3 = { workspace = true, optional = true }
test-foo-bar-traits = { workspace = true, optional = true }

[features]
blake2 = ["dep:test-foo-bar-blake2", "dep:test-foo-bar-traits"]
default = ["blake2", "sha2", "sha3"]
sha2 = ["dep:test-foo-bar-sha2", "dep:test-foo-bar-traits"]
sha3 = ["dep:test-foo-bar-sha3", "dep:test-foo-bar-traits"]
