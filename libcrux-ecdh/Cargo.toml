[package]
description = "Libcrux ECDH implementation"
name = "test-foo-bar-ecdh"
readme = "Readme.md"
version = "0.0.7"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/ecdh.rs"

[dependencies]
rand = { version = "0.10", default-features = false }
test-foo-bar-curve25519 = { workspace = true, default-features = true }
test-foo-bar-p256 = { workspace = true, default-features = true, features = [
    "expose-hacl",
] }
tls_codec = { version = "0.4.2", features = ["derive"], optional = true }

[features]
codec = ["dep:tls_codec"]
default = ["std"]
std = ["rand/std"]

[dev-dependencies]
hex = { version = "0.4.3", features = ["serde"] }
pretty_env_logger = "0.5"
rand = { version = "0.10", features = ["sys_rng"] }
rand_core = { version = "0.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
